name: Release

# Push a tag such as v2.3.0.2 to publish that version. Sites with the plugin are
# offered it on their Plugins screen within about 12 hours.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the release files
        run: python3 tools/build-release.py --tag "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/wordpress-code-ai.zip dist/update.json --clobber
          else
            gh release create "$TAG" dist/wordpress-code-ai.zip dist/update.json \
              --verify-tag --title "wordpress-code-ai ${TAG#v}" --notes-file dist/notes.md
          fi
